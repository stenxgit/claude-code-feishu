name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Dev dependencies are needed here even though `start` installs with
      # --production, since typecheck runs tsc.
      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
